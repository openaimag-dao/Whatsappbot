<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Эмулятор бота</title>
<style>
  :root {
    --bg: #efeae2; --panel: #f0f2f5; --header: #008069; --header-text: #fff;
    --in: #ffffff; --out: #d9fdd3; --text: #111b21; --muted: #667781; --accent: #008069;
    --border: #d1d7db; --chip: #ffffff; --sheet: #ffffff; --shadow: rgba(11, 20, 26, .13);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b141a; --panel: #111b21; --header: #202c33; --header-text: #e9edef;
      --in: #202c33; --out: #005c4b; --text: #e9edef; --muted: #8696a0; --accent: #00a884;
      --border: #2a3942; --chip: #202c33; --sheet: #111b21; --shadow: rgba(0, 0, 0, .4);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 14.2px/1.4 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--panel); color: var(--text);
    display: flex; justify-content: center;
  }
  .layout { display: flex; width: 100%; max-width: 1200px; height: 100%; gap: 0; }
  .chat { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; background: var(--bg); }
  header {
    background: var(--header); color: var(--header-text);
    padding: 10px 16px; display: flex; align-items: center; gap: 12px;
  }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%; background: #fff; color: var(--header);
    display: grid; place-items: center; font-weight: 700; flex: none;
  }
  .title { flex: 1; min-width: 0; }
  .title b { display: block; }
  .title small { opacity: .8; }
  header button {
    background: transparent; color: inherit; border: 1px solid currentColor; border-radius: 16px;
    padding: 5px 12px; cursor: pointer; font: inherit; opacity: .9;
  }
  #log { flex: 1; overflow-y: auto; padding: 16px 6%; display: flex; flex-direction: column; gap: 6px; }
  .msg { max-width: min(520px, 85%); display: flex; flex-direction: column; gap: 4px; }
  .msg.in { align-self: flex-start; }
  .msg.out { align-self: flex-end; }
  .bubble {
    padding: 7px 9px 8px; border-radius: 8px; box-shadow: 0 1px .5px var(--shadow);
    white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere;
  }
  .in .bubble { background: var(--in); border-top-left-radius: 0; }
  .out .bubble { background: var(--out); border-top-right-radius: 0; }
  .bubble a { color: #027eb5; }
  .time { font-size: 11px; color: var(--muted); text-align: right; margin-top: 2px; }
  .chips { display: flex; flex-direction: column; gap: 4px; }
  .chip {
    background: var(--chip); color: var(--accent); border: none; border-radius: 8px;
    padding: 9px; font: inherit; font-weight: 500; cursor: pointer; box-shadow: 0 1px .5px var(--shadow);
  }
  .chip:hover { filter: brightness(.97); }
  .chip:disabled { color: var(--muted); cursor: default; }
  .system { align-self: center; background: var(--panel); color: var(--muted); font-size: 12.5px;
    padding: 5px 12px; border-radius: 8px; box-shadow: 0 1px .5px var(--shadow); }
  #managerForm input { background: var(--in); }
  form button.attach { background: transparent; color: var(--muted); font-size: 22px; }
  .thumbs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 4px; }
  .thumbs img { max-width: 160px; max-height: 120px; border-radius: 6px; display: block; }
  .thumbs .file { background: rgba(0, 0, 0, .06); border-radius: 6px; padding: 8px 10px; font-size: 13px; }
  form { display: flex; gap: 8px; padding: 8px 12px; background: var(--panel); }
  form input {
    flex: 1; border: none; border-radius: 8px; padding: 11px 12px; font: inherit;
    background: var(--in); color: var(--text); min-width: 0;
  }
  form button {
    border: none; border-radius: 50%; width: 44px; height: 44px; flex: none;
    background: var(--accent); color: #fff; font-size: 18px; cursor: pointer;
  }
  .typing { color: var(--muted); font-style: italic; padding: 0 6% 6px; min-height: 20px; font-size: 12.5px; }

  aside {
    flex: 0 0 340px; display: flex; flex-direction: column; border-left: 1px solid var(--border);
    background: var(--panel);
  }
  aside h2 { margin: 0; padding: 14px 16px; font-size: 15px; border-bottom: 1px solid var(--border); }
  aside .hint { padding: 10px 16px; color: var(--muted); font-size: 12.5px; border-bottom: 1px solid var(--border); }
  #managerLog { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  #managerLog .bubble { background: var(--in); border-radius: 8px; font-size: 13px; }
  .doc { display: flex; gap: 10px; align-items: center; text-decoration: none; color: var(--text);
    background: rgba(0, 0, 0, .05); border-radius: 6px; padding: 10px; }
  .doc .icon { background: #e5483f; color: #fff; font-size: 11px; font-weight: 700; border-radius: 4px; padding: 8px 6px; }
  .doc small { color: var(--muted); display: block; }
  .caption { margin-top: 6px; }
  #managerForm { padding: 8px; border-top: 1px solid var(--border); }
  .empty { color: var(--muted); text-align: center; margin-top: 24px; font-size: 13px; }

  .sheet-backdrop {
    position: fixed; inset: 0; background: rgba(0, 0, 0, .4); display: none; align-items: flex-end; justify-content: center;
  }
  .sheet-backdrop.open { display: flex; }
  .sheet {
    background: var(--sheet); width: 100%; max-width: 520px; max-height: 80vh; overflow-y: auto;
    border-radius: 12px 12px 0 0; padding: 8px 0 16px;
  }
  .sheet h3 { text-align: center; margin: 8px 0 12px; font-size: 16px; }
  .row {
    display: flex; flex-direction: column; gap: 2px; width: 100%; text-align: left; border: none; background: none;
    color: var(--text); font: inherit; padding: 10px 20px; cursor: pointer; border-bottom: 1px solid var(--border);
  }
  .row:hover { background: var(--panel); }
  .row small { color: var(--muted); }

  @media (max-width: 820px) {
    aside { display: none; }
    body.show-manager aside { display: flex; position: fixed; inset: 0; z-index: 5; }
    #log { padding: 12px 16px; }
    .typing { padding: 0 16px 6px; }
  }
  @media (min-width: 821px) { #managerToggle { display: none; } }
</style>
</head>
<body>
<div class="layout">
  <section class="chat">
    <header>
      <div class="avatar">AI</div>
      <div class="title"><b id="shopName">Бот</b><small>эмулятор WhatsApp · сообщения не уходят клиентам</small></div>
      <button id="managerToggle" type="button">Менеджер</button>
      <button id="reset" type="button">Сброс</button>
    </header>
    <div id="log"></div>
    <div class="typing" id="typing"></div>
    <form id="form" autocomplete="off">
      <input type="file" id="file" accept="image/*,application/pdf,.xlsx" multiple hidden>
      <button type="button" id="attach" class="attach" aria-label="Прикрепить спецификацию" title="Фото, PDF или Excel">📎</button>
      <input id="input" placeholder="Сообщение или 📎 фото спецификации" maxlength="1000">
      <button type="submit" aria-label="Отправить">➤</button>
    </form>
  </section>
  <aside>
    <h2>📥 Уведомления менеджеру <small id="closeManager" style="float:right;cursor:pointer">✕</small></h2>
    <div class="hint">Что придёт на номер менеджера: заявки, КП на проверку, запросы «позвать менеджера». Внизу можно ответить от имени менеджера.</div>
    <div id="managerLog"><div class="empty">Пока пусто</div></div>
    <form id="managerForm" autocomplete="off">
      <input id="managerInput" placeholder="Ответ менеджера, например «ок 1001»" maxlength="500">
      <button type="submit" aria-label="Отправить как менеджер">➤</button>
    </form>
  </aside>
</div>
<div class="sheet-backdrop" id="sheet"><div class="sheet" id="sheetBody"></div></div>

<script>
  const params = new URLSearchParams(location.search);
  const token = params.get('token') || '';
  const storage = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };
  let user = storage.get('sim-user');
  if (!user) { user = Math.random().toString(36).slice(2, 10); storage.set('sim-user', user); }

  const log = document.getElementById('log');
  const managerLog = document.getElementById('managerLog');
  const typing = document.getElementById('typing');
  const input = document.getElementById('input');
  const sheet = document.getElementById('sheet');
  const sheetBody = document.getElementById('sheetBody');

  const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  // Разметка WhatsApp: *жирный*, _курсив_, ~зачёркнутый~, ссылки.
  const fmt = (s) => esc(s)
    .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|[\s(«])\*([^*\n]+)\*(?=[\s).,!?:»]|$)/g, '$1<b>$2</b>')
    .replace(/(^|[\s(«])_([^_\n]+)_(?=[\s).,!?:»]|$)/g, '$1<i>$2</i>')
    .replace(/(^|[\s(«])~([^~\n]+)~(?=[\s).,!?:»]|$)/g, '$1<s>$2</s>');
  const now = () => new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });

  function bubble(dir, html) {
    const wrap = document.createElement('div');
    wrap.className = `msg ${dir}`;
    wrap.innerHTML = `<div class="bubble">${html}<div class="time">${now()}</div></div>`;
    log.appendChild(wrap);
    return wrap;
  }
  const scroll = () => { log.scrollTop = log.scrollHeight; };

  const fileUrl = (m) => `/simulator/files/${m.fileId}${token ? `?token=${encodeURIComponent(token)}` : ''}`;
  const docHtml = (m) =>
    `<a class="doc" href="${fileUrl(m)}" target="_blank" rel="noopener"><span class="icon">PDF</span>` +
    `<span>${esc(m.filename)}<small>${Math.max(1, Math.round(m.size / 1024))} КБ · открыть</small></span></a>` +
    (m.caption ? `<div class="caption">${fmt(m.caption)}</div>` : '');

  function renderBot(m) {
    const wrap = bubble('in', m.type === 'document' ? docHtml(m) : fmt(m.body));
    if (m.type === 'buttons') {
      const chips = document.createElement('div');
      chips.className = 'chips';
      for (const b of m.buttons) {
        const el = document.createElement('button');
        el.className = 'chip';
        el.textContent = b.title;
        el.onclick = () => send({ replyId: b.id, label: b.title });
        chips.appendChild(el);
      }
      wrap.appendChild(chips);
    } else if (m.type === 'list') {
      const chips = document.createElement('div');
      chips.className = 'chips';
      const el = document.createElement('button');
      el.className = 'chip';
      el.textContent = `☰ ${m.buttonText}`;
      el.onclick = () => openSheet(m);
      chips.appendChild(el);
      wrap.appendChild(chips);
    }
  }

  function openSheet(m) {
    sheetBody.innerHTML = `<h3>${esc(m.buttonText)}</h3>`;
    for (const r of m.rows) {
      const el = document.createElement('button');
      el.className = 'row';
      el.innerHTML = `<span>${esc(r.title)}</span>${r.description ? `<small>${esc(r.description)}</small>` : ''}`;
      el.onclick = () => { sheet.classList.remove('open'); send({ replyId: r.id, label: r.title }); };
      sheetBody.appendChild(el);
    }
    sheet.classList.add('open');
  }
  sheet.onclick = (e) => { if (e.target === sheet) sheet.classList.remove('open'); };

  function renderManager(m) {
    managerLog.querySelector('.empty')?.remove();
    const el = document.createElement('div');
    el.className = 'bubble';
    el.innerHTML = `${m.type === 'document' ? docHtml(m) : fmt(m.body)}<div class="time">${now()}</div>`;
    if (m.type === 'buttons') el.insertAdjacentHTML('beforeend', `<div class="time">кнопки: ${m.buttons.map((b) => esc(b.title)).join(' · ')}</div>`);
    managerLog.appendChild(el);
    managerLog.scrollTop = managerLog.scrollHeight;
  }

  async function api(path, body) {
    const res = await fetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...(token ? { 'X-Admin-Token': token } : {}) },
      body: JSON.stringify({ user, ...body }),
    });
    if (!res.ok) throw new Error(res.status === 403 ? 'Нет доступа: добавьте ?token=… в адрес' : `Ошибка ${res.status}`);
    return res.json();
  }

  let busy = false;
  async function send({ text, replyId, label, as, files }) {
    if (busy) return;
    busy = true;
    if (files?.length) {
      const thumbs = files.map((f) => f.mime.startsWith('image/')
        ? `<img src="data:${f.mime};base64,${f.data}" alt="">`
        : `<span class="file">📄 ${esc(f.name)}</span>`).join('');
      bubble('out', `<div class="thumbs">${thumbs}</div>${text ? esc(text) : ''}`);
    } else if (as === 'manager') {
      managerLog.querySelector('.empty')?.remove();
      managerLog.insertAdjacentHTML('beforeend', `<div class="bubble" style="background:var(--out);align-self:flex-end">${esc(text)}<div class="time">${now()} · менеджер</div></div>`);
    } else {
      bubble('out', esc(label ?? text));
    }
    scroll();
    typing.textContent = 'печатает…';
    try {
      if (files?.length) typing.textContent = 'разбирает спецификацию… (до минуты)';
      const data = await api('/simulator/api/message', { text, replyId, as, files, name: 'Тест' });
      for (const m of data.messages) renderBot(m);
      for (const m of data.manager) renderManager(m);
      if (!data.messages.length && as !== 'manager') log.insertAdjacentHTML('beforeend', '<div class="system">бот промолчал (например, клиент в режиме «менеджер»)</div>');
    } catch (err) {
      log.insertAdjacentHTML('beforeend', `<div class="system">${esc(err.message)}</div>`);
    } finally {
      typing.textContent = '';
      busy = false;
      scroll();
    }
  }

  document.getElementById('form').onsubmit = (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    send({ text });
  };
  // Фото уменьшаем до 2000 px (лимит Claude — 5 МБ на изображение), PDF и Excel отправляем как есть.
  const toBase64 = (blob) => new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result).split(',')[1]);
    r.onerror = reject;
    r.readAsDataURL(blob);
  });
  async function prepare(file) {
    if (!file.type.startsWith('image/')) return { name: file.name, mime: file.type || 'application/octet-stream', data: await toBase64(file) };
    const img = await createImageBitmap(file);
    const scale = Math.min(1, 2000 / Math.max(img.width, img.height));
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(img.width * scale);
    canvas.height = Math.round(img.height * scale);
    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
    const blob = await new Promise((r) => canvas.toBlob(r, 'image/jpeg', 0.85));
    return { name: file.name, mime: 'image/jpeg', data: await toBase64(blob) };
  }
  const fileInput = document.getElementById('file');
  document.getElementById('attach').onclick = () => fileInput.click();
  fileInput.onchange = async () => {
    const list = [...fileInput.files].slice(0, 10);
    fileInput.value = '';
    if (!list.length) return;
    const files = await Promise.all(list.map(prepare));
    const text = input.value.trim();
    input.value = '';
    send({ files, text });
  };

  document.getElementById('managerForm').onsubmit = (e) => {
    e.preventDefault();
    const field = document.getElementById('managerInput');
    const text = field.value.trim();
    if (!text) return;
    field.value = '';
    send({ text, as: 'manager' });
  };
  document.getElementById('reset').onclick = async () => {
    await api('/simulator/api/reset', {}).catch(() => {});
    log.innerHTML = '';
    managerLog.innerHTML = '<div class="empty">Пока пусто</div>';
    log.insertAdjacentHTML('beforeend', '<div class="system">Диалог сброшен. Напишите «привет».</div>');
  };
  document.getElementById('managerToggle').onclick = () => document.body.classList.toggle('show-manager');
  document.querySelector('aside h2').onclick = () => document.body.classList.remove('show-manager');

  fetch('/simulator/api/info').then((r) => r.json()).then(({ shop }) => {
    document.getElementById('shopName').textContent = shop;
    document.title = `${shop} — эмулятор`;
  }).catch(() => {});
  log.insertAdjacentHTML('beforeend', '<div class="system">Это эмулятор: тот же бот, что будет в WhatsApp. Напишите «привет».</div>');
</script>
</body>
</html>
